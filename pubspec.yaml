name: rafiqah
description: "رفيقة — رفيقتك الذكية في رحلة الأمومة (Offline-First women's health app)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Database (Drift/SQLite)
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # Encryption / Security
  encrypt: ^5.0.3
  flutter_secure_storage: ^9.2.2

  # Integrations
  url_launcher: ^6.3.0
  connectivity_plus: ^6.0.3
  http: ^1.2.0
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  # AdMob
  # UI / Utils
  intl: ^0.20.2
  google_fonts: ^6.2.1
  table_calendar: ^3.1.2
  fl_chart: ^0.68.0
  uuid: ^4.4.0
  collection: ^1.18.0
  google_mobile_ads: ^9.2.0
  google_sign_in: ^7.2.0
  googleapis: ^17.0.0

  # JSON (food seeding)
  # (uses dart:convert built-in)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

  # Code generation
  build_runner: ^2.4.9
  drift_dev: ^2.18.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  assets:
    - assets/data/foods_init.json
    - assets/images/
  # fonts bundled via google_fonts package at runtime