name: rafiqah
description: "رفيقة — رفيقتك الذكية في رحلة الأمومة (Offline-First women's health app)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Database (Drift/SQLite)
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # Encryption / Security (AES-GCM + PBKDF2)
  crypto: ^3.0.7
  pointycastle: ^3.9.1

  # Integrations
  url_launcher: ^6.3.0
  http: ^1.2.0
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  # Ads
  google_mobile_ads: ^9.2.0

  # Backup (Google Drive appdata)
  google_sign_in: ^7.2.0
  googleapis: ^17.0.0

  # UI / Utils
  intl: ^0.20.2
  table_calendar: ^3.1.2
  fl_chart: ^0.68.0
  wakelock_plus: ^1.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

  # Code generation
  build_runner: ^2.4.9
  drift_dev: ^2.18.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/fonts/

  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#7C3AED"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  min_sdk_android: 24
